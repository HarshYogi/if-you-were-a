<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>If You Were a… | Aakansha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="embers" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<!-- Moon = hidden easter egg -->
<button id="moon" class="moon" aria-label="A small moon"></button>

<!-- Intro -->
<section id="intro" class="intro">
  <p class="intro-small">Day 4</p>
  <h1>If you were a…</h1>
  <p class="intro-sub">Nine cards. One girl. Many Personalities.</p>
  <button id="begin" class="btn">Open the deck</button>
</section>

<!-- Deck -->
<main id="deck" class="deck hidden">
  <header class="deck-head">
    <h2>If you were a…</h2>
    <p id="progress">0 of 9 turned</p>
  </header>
  <div id="grid" class="grid"></div>
</main>

<!-- Stage overlay for each card -->
<section id="stage" class="stage hidden" aria-live="polite">
  <canvas id="stage-canvas"></canvas>
  <div id="stage-overlay" class="stage-overlay"></div>
  <div class="stage-text">
    <h3 id="stage-title"></h3>
    <p id="stage-caption"></p>
    <p id="stage-hint" class="hint"></p>
  </div>
  <button id="close" class="close" aria-label="Back to the deck">Back</button>
  <button id="mute" class="mute" aria-label="Toggle sound">Sound on</button>
</section>

<!-- Secret -->
<div id="secret" class="secret hidden">
  <div class="secret-box">
    <p id="secret-text"></p>
    <button id="secret-close" class="btn small">Close</button>
  </div>
</div>

<audio id="song" preload="auto" loop></audio>
<script src="script.js"></script>
</body>
</html>
